name: KiriKiri engine build (vendor/kirikiroid2)

# Real, separate build from build.yml -- vendor/kirikiroid2/project/android
# is its own complete, self-contained Gradle project (own settings.gradle,
# own root build.gradle, a real :cocos2dx module), NOT something that gets
# linked into this repo's own :app module. It's the actual real enginehost
# plugin now (see its own AndroidManifest.xml -- MainActivity declares
# dev.enginehost.plugin.RUN directly), so this repo needs to build IT, not
# a separate Kotlin wrapper.
#
# manual trigger ONLY, deliberately -- confirmed via a real failed run
# (2fdfecc) that :cocos2dx's own real target
# (thirdparty/port/cocos2d-x/cocos/platform/android/libcocos2dx,
# .gitignore'd, never vendored) doesn't exist yet. Per this project's own
# readme.md ("(1) prepare" section), that whole thirdparty/port/ tree is
# populated by real, separate build scripts (_fetch.sh, then
# _androida64.sh/script/cross_android64.sh) that download and
# cross-compile roughly a dozen real third-party C/C++ projects first --
# libvorbis, opus, libogg, opusfile, SDL2, oniguruma, breakpad, a FFmpeg
# fork, oboe, openal-soft, libjpeg-turbo, opencv 4.7.0, lz4, libarchive,
# and cocos2d-x 3.17.2 itself (real URLs listed in readme.md's own
# "prepare" section). That's a genuinely large, multi-hour native build
# pipeline with real external downloads this session didn't have
# clearance to run unsupervised -- automatic push/PR triggers would just
# fail this workflow on every future commit until that pipeline is set
# up for real. Re-enable push/pull_request triggers only once _fetch.sh +
# _androida64.sh have actually been run (or their real output vendored)
# somewhere this workflow's checkout can see.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vendor/kirikiroid2/project/android
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Real, pinned version this project's own build.gradle asks for
      # (externalNativeBuild.cmake.arguments) -- the runner's default NDK
      # is a different version, not necessarily ABI/API-compatible with
      # this project's own C++ (real Box64/box86-era native code, no
      # guarantee it builds clean against a newer NDK's stricter clang).
      - name: Install pinned NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "platforms;android-29"

      # Real, unavoidable requirement: app/build.gradle's own debug
      # buildType sets signingConfig signingConfigs.release
      # unconditionally (not just for release) -- a debug build still
      # needs *some* real keystore to sign with. This is a fresh,
      # disposable CI-only debug key (Android's own standard debug
      # keystore credentials), not droidtop's own real production
      # signing identity -- completely separate concern, this vendored
      # third-party engine doesn't share droidtop's own signing setup at
      # all.
      - name: Generate a disposable debug keystore
        run: |
          # A real, pre-existing app/sign.jks is already checked into this
          # vendor tree (someone's own placeholder, unknown real
          # password) -- keytool refuses to overwrite an existing
          # keystore file it can't first load, so it has to go before
          # generating a fresh one.
          rm -f app/sign.jks
          keytool -genkeypair -v -keystore app/sign.jks -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        env:
          SIGN_KEY_ALIAS: androiddebugkey
          SIGN_KEY_PASS: android
          SIGN_STORE_PASS: android
        run: chmod +x gradlew && ./gradlew :krkr2yuri:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kirikiroid2-engine-debug-apk
          path: vendor/kirikiroid2/project/android/app/build/outputs/apk/debug/*.apk
